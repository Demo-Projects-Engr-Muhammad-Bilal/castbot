name: Build and deploy Node.js app to Azure Web App - castbot-backend-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies & Generate Prisma
        run: |
          npm ci
          npm run generate --workspace=packages/database

      - name: Build Workspaces
        run: |
          npm run build --workspace=packages/database
          npm run build:backend

      - name: Bundle Production Package
        run: |
          mkdir -p deploy/dist
          cp -r apps/backend/dist/* ./deploy/dist/
          cp apps/backend/package.json ./deploy/
          
          # Production dependencies install inside deploy folder
          cd deploy
          npm install --omit=dev --legacy-peer-deps @prisma/client
          
          # Copy generated Prisma Client & Database dist from root node_modules
          mkdir -p node_modules/@prisma node_modules/@repo
          cp -r ../node_modules/.prisma ./node_modules/ 2>/dev/null || true
          cp -r ../node_modules/@prisma/client ./node_modules/@prisma/ 2>/dev/null || true
          cp -r ../packages/database/dist ./node_modules/@repo/database 2>/dev/null || true
          
          zip -r ../release.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'castbot-backend-api'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip