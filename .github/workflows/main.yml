name: Build and deploy Node.js app to Azure Web App - castbot-backend-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies & Generate Prisma
        run: |
          npm ci
          npm run generate --workspace=packages/database

      - name: Build Database & Backend Workspaces
        run: |
          npm run build --workspace=packages/database
          npm run build:backend

      - name: Bundle Production Package
        run: |
          mkdir -p deploy/dist
          
          # Copy compiled backend code and package config
          cp -r apps/backend/dist/* ./deploy/dist/
          cp apps/backend/package.json ./deploy/
          
          # Copy node_modules and compiled local database package directly
          cp -r node_modules ./deploy/node_modules
          mkdir -p ./deploy/node_modules/@repo/database
          cp -r packages/database/dist ./deploy/node_modules/@repo/database/
          cp packages/database/package.json ./deploy/node_modules/@repo/database/
          
          cd deploy && zip -r ../release.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'castbot-backend-api'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip